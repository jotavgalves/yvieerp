name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YVIE_ADMIN_PASSWORD: ci-only-password
      YVIE_SESSION_SECRET: ci-only-session-secret-32-characters-minimum
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate D1 migrations
        run: npm run db:migrate:local

      - name: Build
        run: npm run build
