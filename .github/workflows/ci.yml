name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YVIE_ADMIN_PASSWORD: ci-only-password
      YVIE_SESSION_SECRET: ci-only-session-secret-32-characters-minimum
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate D1 migrations
        run: npm run db:migrate:local

      - name: D1 price persistence smoke test
        run: npx wrangler d1 execute DB --local --file=./scripts/price-persistence-smoke.sql

      - name: D1 pricing hierarchy smoke test
        run: npx wrangler d1 execute DB --local --file=./scripts/pricing-hierarchy-smoke.sql

      - name: D1 cost and stock capital smoke test
        run: npx wrangler d1 execute DB --local --file=./scripts/cost-capital-smoke.sql

      - name: D1 operational integrity smoke test
        run: npx wrangler d1 execute DB --local --file=./scripts/integrity-smoke.sql

      - name: Build
        run: npm run build
